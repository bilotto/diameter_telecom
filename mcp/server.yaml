server:
  name: "diameter-mcp"
  version: "2.0.0"
  host: "0.0.0.0"
  port: 8788
  debug: false
  threaded: true

mcp:
  protocol_version: "2025-06-18"
  capabilities:
    tools:
      listChanged: false
    resources:
      subscribe: false
      listChanged: false
    # prompts:
    #   listChanged: false
    # logging:
    #   level: "debug"
  error_codes:
    invalid_params: -32602
    method_not_found: -32601
    internal_error: -32603

logging:
  # Main logging configuration
  level: "DEBUG"  # Main log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  format: "%(asctime)s %(name)-22s %(levelname)-7s %(message)s"
  # File output configuration
  file_output: true  # Enable/disable file logging
  log_file: "logs/diameter_mcp_server.log"  # Log file path
  file_mode: "w"  # "a" for append, "w" for write (overwrite)
  # Console output configuration
  console_output: true  # Enable/disable console logging
  console_level: "DEBUG"  # Console log level (can be different from file level)
  # Component-specific log levels (override defaults)
  component_levels:
    # Diameter library components
    "diameter.peer.msg": "ERROR"  # Reduce peer message noise
    "diameter.node": "ERROR"         # Node operations
    "diameter.peer": "ERROR"   # Connection events
    "diameter.stats": "WARNING"     # Statistics (usually noisy)
    # Diameter telecom library components
    "diameter_telecom": "INFO"                    # Main library
    "diameter_telecom.services": "INFO"           # Service layer
    "diameter_telecom.entities_3gpp": "INFO"      # 3GPP entities
    # Web server components
    "uvicorn.access": "WARNING"  # HTTP access logs (reduce noise)
    "uvicorn.error": "INFO"      # Server errors

tools:
  create_node:
    active: true
    title: "Create Diameter node"
    description: "Create a Diameter node - a point in the network that can send and receive Diameter messages. Each node has an Origin-Host (unique identifier like a hostname) and Origin-Realm (domain-style namespace for routing). A node has a single TCP port and one or more IP addresses that supports multiple applications. Nodes run applications and connect to peers, which are essentialy external Diameter nodes. For standard 3GPP networks (PCRF, PCEF, AF, OCS), consider using 'create_3gpp_node' instead for automatic configuration."
    input_schema:
      type: "object"
      properties:
        origin_host:
          type: "string"
          description: "Origin host for the node (must be unique)"
        realm_name:
          type: "string"
          description: "Realm name"
        ip_addresses:
          type: "array"
          items:
            type: "string"
          description: "List of IP addresses for the node. Default is ['127.0.0.1']"
          default: ["127.0.0.1"]
        tcp_port:
          type: "integer"
          description: "TCP port for the node (required). It should be unique for each Node running in the same IP address."
        vendor_ids:
          type: "array"
          items:
            type: "integer"
          description: "List of vendor IDs"
          default: [10415]
      required: ["origin_host", "realm_name", "ip_addresses", "tcp_port"]
    output_schema:
      type: "object"
      properties:
        node_id:
          type: "string"
          description: "Unique identifier of the created node"
        realm_name:
          type: "string"
          description: "Realm name of the node"
        ip_addresses:
          type: "array"
          items:
            type: "string"
          description: "IP addresses configured for the node"
        tcp_port:
          type: "integer"
          description: "TCP port of the node"
        vendor_ids:
          type: "array"
          items:
            type: "integer"
          description: "Vendor IDs configured for the node"
        status:
          type: "string"
          description: "Creation status"
          enum: ["created", "already_exists"]
      required: ["status"]
    annotations:
      read_only: false
    handler: "create_node_handler"
    service: "diameter"
    method: "create_node"

  add_application_to_node:
    active: true
    title: "Add application to node with peers"
    description: "Add a application identified by their app_id (16777238 for Gx, 16777236 for Rx, 16777302 for Sy) to a node. Peers are required when adding the applications. Only add the peers associated with the app_id. Key applications: Gx for policy control, Rx for VoLTE, Sy for charging. This establishes peer connections and enables message exchange. For standard 3GPP networks (PCRF, PCEF, AF, OCS), consider using 'create_3gpp_node' instead for automatic configuration."
    input_schema:
      type: "object"
      properties:
        origin_host:
          type: "string"
          description: "Origin host of the node to add application to"
        app_id:
          type: "integer"
          description: "Application ID to add. Valid values: 16777238 (Gx), 16777236 (Rx), 16777302 (Sy)"
          enum: [16777238, 16777236, 16777302]
        peers:
          type: "array"
          items:
            type: "object"
            properties:
              peer_host:
                type: "string"
                description: "Origin host of the peer"
              peer_realm:
                type: "string"
                description: "Realm of the peer"
              peer_port:
                type: "integer"
                description: "TCP port of the peer. When the application is initiating the connection, the peer_ip and peer_port are required. If the application is not initiating the connection, the peer_ip and peer_port values won't matter for TCP protocol."
                default: 3868
              peer_ip:
                type: "array"
                items:
                  type: "string"
                description: "IP address of the peer. When the application is initiating the connection, the peer_ip and peer_port are required. If the application is not initiating the connection, the peer_ip and peer_port values won't matter for TCP protocol."
                default: ["127.0.0.1"]
              initiate_connection:
                type: "boolean"
                description: "Whether this node should initiate the connection"
            required: ["peer_host", "peer_realm", "initiate_connection"]
          description: "List of peers to connect to for this application"
          default: []
        max_threads:
          type: "integer"
          description: "Maximum threads for the application (default: 1)"
          default: 1
        realms:
          type: "array"
          items:
            type: "string"
          description: "Applications normally need to support more realms than the peer's realm connections. For instance if a PCEF is connecting to PCRF but there is a DSC in between, the PCEF needs to support the PCRF realm other than the peer's realm (DSC)"
          default: []
      required: ["origin_host", "app_id", "peers"]
    annotations:
      read_only: false
    handler: "add_application_to_node_handler"
    service: "diameter"
    method: "add_application_to_node"

  create_3gpp_node:
    active: true
    title: "Create a node with specific role in 3gpp network"
    description: "Create a role specific node for telecom networks: PCRF, PCEF, AF, OCS, DSC. The tool creates the node, adds the required applications for each role with peers and can start the node."
    input_schema:
      type: "object"
      properties:
        node:
          type: "object"
          properties:
            origin_host:
              type: "string"
              description: "Origin host of the node (must be unique)"
            realm_name:
              type: "string"
              description: "Realm of the node"
            ip_addresses:
              type: "array"
              items:
                type: "string"
              description: "List of IP addresses of the node"
              default: ["127.0.0.1"]
            tcp_port:
              type: "integer"
              description: "TCP port for the node (required). PCRF default to 3868, PCEF default to 3869, AF default to 3870, OCS default to 3871, DSC default to 30000"
        entity_role:
          type: "string"
          description: "Type of 3GPP entity to create. PCEF supports Gx, AF supports Rx, OCS supports Sy. PCRF supports Gx/Rx/Sy, DSC supports Gx/Rx/Sy and acts like a router. The DSC needs to add all the peers and realms to ensure proper routing."
          enum: ["PCRF", "PCEF", "AF", "OCS", "DSC"]
        applications:
          type: "array"
          description: "List of the applications the entity supports (only needed for the use case). Each item specifies app_id, peers, and realms."
          items:
            type: "object"
            properties:
              app_id:
                type: "integer"
                description: "Diameter application ID (e.g., 16777238 for Gx, 16777236 for Rx, 16777302 for Sy)"
                enum: [16777238, 16777236, 16777302]
              peers:
                type: "array"
                description: "List of peers that the application connects to or accepts connections from. If the app is initiating the connection, the peer_ip and peer_port are required. If the app is not initiating the connection, the peer_ip and peer_port values won't matter for TCP protocol."
                items:
                  type: "object"
                  properties:
                    peer_host:
                      type: "string"
                      description: "Origin host of the peer entity"
                    peer_realm:
                      type: "string"
                      description: "Realm of the peer entity"
                    peer_ip:
                      type: "array"
                      items:
                        type: "string"
                      description: "IP address of the peer entity. Only required when initiate_connection is true"
                      default: ["127.0.0.1"]
                    peer_port:
                      type: "integer"
                      description: "Port of the peer entity. Only required when initiate_connection is true"
                      default: 3868
                    initiate_connection:
                      type: "boolean"
                      description: "Whether this entity should initiate the connection"
                      default: false
                  required: ["peer_host", "peer_realm", "initiate_connection"]
              realms:
                type: "array"
                items:
                  type: "string"
                description: "Applications normally need to support more realms than the peer's realm connections. For instance if a PCEF is connecting to PCRF but there is a DSC in between, the PCEF needs to support the PCRF realm other than the peer's realm (DSC)."
                default: []
            required: ["app_id", "peers"]
        start:
          type: "boolean"
          description: "Apps that dont init connection with peers can be started right away and they will just wait for the connection to be established. Apps "
          default: false
      required: ["entity_role", "node", "applications"]
    annotations:
      read_only: false
    handler: "create_3gpp_node_handler"
    service: "diameter"
    method: "create_3gpp_node"

  start_nodes:
    active: true
    title: "Start nodes in NodeManager"
    description: "Start Diameter nodes to activate peer connections and enable message exchange. Nodes perform Capability Exchange (CER/CEA handshake) to establish connections. Can start single or multiple nodes. Accepting nodes start first, then initiating nodes. Use ['all'] to start all nodes or specify individual node names."
    input_schema:
      type: "object"
      properties:
        origin_hosts:
          type: "array"
          items:
            type: "string"
          description: "List of node origin_hosts to start, or ['all'] to start all nodes"
          default: ["all"]
      required: []
    output_schema:
      type: "object"
      properties:
        started_nodes:
          type: "array"
          description: "List of nodes that were started"
          items:
            type: "string"
        already_started:
          type: "array"
          description: "List of nodes that were already started before this operation"
          items:
            type: "string"
        successfully_started:
          type: "integer"
          description: "Number of nodes successfully started in this operation"
        failed_count:
          type: "integer"
          description: "Number of nodes that failed to start"
        total_requested:
          type: "integer"
          description: "Total number of nodes requested to start"
      required: ["started_nodes", "already_started", "successfully_started", "failed_count", "total_requested"]
    annotations:
      read_only: false
    handler: "start_nodes_handler"
    service: "diameter"
    method: "start_nodes"

  list_nodes:
    active: true
    title: "Get the NodeManager object"
    description: "Get the NodeManager object with all the nodes, entities, subscribers, and services."
    input_schema:
      type: "object"
      properties: {}
    annotations:
      read_only: true
    handler: "list_nodes_handler"
    service: "diameter"
    method: "list_nodes"

  create_subscriber:
    active: true
    title: "Create subscriber with MSISDN and IMSI"
    description: "Create a subscriber entity with MSISDN and IMSI."
    input_schema:
      type: "object"
      properties:
        msisdn:
          type: "string"
          description: "MSISDN of the subscriber"
        imsi:
          type: "string"
          description: "IMSI of the subscriber"
    annotations:
      read_only: false
    handler: "create_subscriber_handler"
    service: "diameter"
    method: "create_subscriber"


  create_carrier:
    active: true
    title: "Create carrier entity in NodeManager"
    description: "Create a carrier entity in NodeManager. A carrier entity is a higher level abstraction than a node and can contain multiple nodes. It's used to represent a carrier in the network."
    input_schema:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Name of the carrier. For example: 'ZetaTel'"
        mcc_mnc:
          type: "array"
          items:
            type: "string"
          description: "List of Mobile Country Code (MCC) and Mobile Network Code (MNC) all together. For example: ['724088']"
        country_code:
          type: "string"
          description: "Country code of the carrier. For example: '55' for Brazil"
        n_subscribers:
          type: "integer"
          description: "Number of subscribers of the carrier to be created for this carrier with MSISDN range from <country_code><000000> to <country_code><n_subscribers-1> and IMSI range from <mcc_mnc>"
    annotations:
      read_only: false
    handler: "create_carrier_handler"
    service: "diameter"
    method: "create_carrier"


  create_data_service:
    active: true
    title: "Create a DataService for policy control and charging"
    description: "Create a DataService for policy control and charging"
    input_schema:
      type: "object"
      properties:
        pcef_node:
          type: "string"
          description: "Origin host of the PCEF"
        ocs_node:
          type: "string"
          description: "Origin host of the OCS (optional - enables Sy charging application)"
        carrier_name:
          type: "string"
          description: "Name of the carrier"
      required: ["pcef_node"]
    handler: "create_data_service_handler"
    service: "diameter"
    method: "create_data_service"

  create_voice_service:
    active: true
    title: "Create a VoiceService for policy control and media control"
    description: "Create a VoiceService for policy control and media control"
    input_schema:
      type: "object"
      properties:
        pcef_node:
          type: "string"
          description: "PCEF origin host"
        af_node:
          type: "string"
          description: "AF origin host (optional - enables Rx media application)"
        carrier_name:
          type: "string"
          description: "Name of the carrier"
      required: ["pcef_node"]
    handler: "create_voice_service_handler"
    service: "diameter"
    method: "create_voice_service"

  cleanup_nodes:
    active: true
    title: "Clean up all Diameter nodes and reset memory for a fresh start"
    description: "Clean up all Diameter nodes and reset memory for a fresh start. This stops all nodes, clears memory, and prepares for new node creation. Use this to start over with a clean slate. Example: Clean up PCRF/PCEF/OCS network to build new 3GPP topology from scratch"
    input_schema:
      type: "object"
      properties: {}
    annotations:
      read_only: false
    handler: "cleanup_nodes_handler"
    service: "diameter"
    method: "cleanup_nodes"



dependencies:
  diameter_telecom:
    import_path: "diameter_telecom.diameter.session_manager"
    class_name: "SessionManager"
  diameter:
    import_path: "diameter.node"
    class_name: "Node"

services:
  diameter:
    class: "DiameterService"
    dependencies: ["diameter_telecom", "diameter"]




