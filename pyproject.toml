[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diameter-telecom"
version = "1.0.0"
description = "Diameter protocol applications for telecommunications networks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fabio Bilotto", email = "fbilotto@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "python-diameter",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
